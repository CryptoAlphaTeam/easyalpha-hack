[package]
name = "near-subscription"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.17.2"
borsh = "1.5"
serde = { version = "1.0", features = ["derive"] }

[features]
default = ["legacy"]
legacy = ["near-sdk/legacy"]
non-contract-usage = ["near-sdk/non-contract-usage", "near-sdk/legacy"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"

